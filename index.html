<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oración - 8vo Corazón de Nazaret</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-schoenstatt:#1a3a6e;
    --dorado:#c5a059;
    --fondo:#fdfaf5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--fondo);
    font-family:'Inter', sans-serif;
    color:#2c2c2c;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  .card{
    background:white;
    max-width:600px;
    width:100%;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(26,58,110,0.12);
    padding:48px 40px;
    text-align:center;
    border-top:6px solid var(--azul-schoenstatt);
    position:relative;
  }
  .icon{
    font-size:32px;
    margin-bottom:16px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    color:var(--azul-schoenstatt);
    font-size:26px;
    font-weight:600;
    line-height:1.2;
    margin-bottom:8px;
  }
  .subtitle{
    color:var(--dorado);
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:28px;
    font-weight:400;
  }
  .oracion{
    font-family:'Cormorant Garamond', serif;
    font-size:20px;
    line-height:1.7;
    color:#333;
    margin-bottom:28px;
    font-style:italic;
  }
  .divider{
    width:60px;
    height:2px;
    background:var(--dorado);
    margin:0 auto 28px auto;
    opacity:0.6;
  }
  .peticion{
    background:#f7f3ec;
    border-radius:12px;
    padding:16px;
    font-size:14.5px;
    line-height:1.5;
    color:var(--azul-schoenstatt);
    font-weight:400;
  }
  .peticion strong{
    color:var(--azul-schoenstatt);
  }
  footer{
    margin-top:32px;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#999;
  }
</style>
</head>
<body>
